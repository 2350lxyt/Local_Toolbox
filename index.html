<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>本地工具箱 · 纯客户端计算工具集</title>
    <meta
      name="description"
      content="一个完全在浏览器本地运行的工具集合，所有计算均在本机完成，不上传数据，不请求第三方资源。"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)" />

    <!-- 首屏主题引导：必须在样式表之前同步执行，避免明暗切换闪烁 -->
    <script src="./assets/js/theme-boot.js"></script>

    <link rel="stylesheet" href="./assets/css/tokens.css" />
    <link rel="stylesheet" href="./assets/css/base.css" />
    <link rel="stylesheet" href="./assets/css/shell.css" />
    <link rel="stylesheet" href="./assets/css/tool.css" />
    <link rel="stylesheet" href="./assets/css/tabs.css" />
  </head>

  <body>
    <noscript>
      <p class="no-script">
        本站需要启用 JavaScript 才能运行。所有计算都在你的浏览器本地完成，不会上传任何数据。
        <a href="./assets/noscript.html">查看说明</a>
      </p>
    </noscript>

    <!-- 应用外壳（左侧工具列表 + 顶部栏）由此节点注入 -->
    <div id="shell-root"></div>

    <main class="workspace" id="workspace">
      <!-- 首页总览：boot 时被整体移入「首页」常驻标签的面板（.tabpanel--home），只移动不重建 -->
      <div class="home-view" data-home-view>
        <section class="hero rise" style="--d: 0ms">
          <div>
            <p class="meta-label">本地工具集 · 零后端</p>
            <h1 class="hero__title">全部在<em>本机</em>完成的工具集</h1>
            <p class="hero__lead">
              一个可长期扩展的工具集合：点击左侧任意工具即可在本页打开标签页，多个工具可同时打开、
              来回切换互不干扰；参数可保存为预设以便复用。
            </p>
          </div>
        </section>

        <div class="section-head rise" style="--d: 60ms">
          <div>
            <p class="meta-label">Tools</p>
            <h2>工具总览</h2>
          </div>
          <p class="panel__hint">
            已注册 <span data-tool-count class="mono">0</span> 个工具
          </p>
        </div>

        <ul class="tool-grid rise" style="--d: 120ms" data-tool-grid></ul>

        <footer class="site-foot rise" style="--d: 180ms" data-site-footer></footer>
      </div>

      <!-- 标签工作台：打开任一工具后显示（docs/DESIGN.md §4.4） -->
      <div class="tabs-workspace" data-tabs-workspace hidden>
        <div class="workbench" data-workbench data-split="off">
          <section class="pane" data-pane="primary" aria-label="主栏">
            <div class="tabstrip" data-tabstrip>
              <!-- 标签溢出时才显示（icon 由 tabs.js 注入） -->
              <button
                class="icon-btn icon-btn--sm tabstrip__scroll"
                type="button"
                data-action="scroll-prev"
                aria-label="向前滚动标签"
                title="向前滚动标签"
                hidden
              ></button>
              <div
                class="tabstrip__list"
                role="tablist"
                aria-label="主栏已打开的工具"
                data-tablist
              ></div>
              <button
                class="icon-btn icon-btn--sm tabstrip__scroll"
                type="button"
                data-action="scroll-next"
                aria-label="向后滚动标签"
                title="向后滚动标签"
                hidden
              ></button>
              <p class="tabstrip__hint meta-label" data-pane-hint>拖拽排序 · 拖到右侧并排</p>
            </div>
            <div class="pane__view" data-pane-view></div>
          </section>

          <div class="workbench__divider" aria-hidden="true"></div>

          <section class="pane" data-pane="secondary" aria-label="并排栏" hidden>
            <div class="tabstrip" data-tabstrip>
              <button
                class="icon-btn icon-btn--sm tabstrip__scroll"
                type="button"
                data-action="scroll-prev"
                aria-label="向前滚动标签"
                title="向前滚动标签"
                hidden
              ></button>
              <div
                class="tabstrip__list"
                role="tablist"
                aria-label="并排栏已打开的工具"
                data-tablist
              ></div>
              <button
                class="icon-btn icon-btn--sm tabstrip__scroll"
                type="button"
                data-action="scroll-next"
                aria-label="向后滚动标签"
                title="向后滚动标签"
                hidden
              ></button>
              <button
                class="icon-btn icon-btn--sm"
                type="button"
                data-action="collapse-split"
                aria-label="退出并排显示"
                title="退出并排显示"
              ></button>
            </div>
            <div class="pane__view" data-pane-view></div>
          </section>

          <!-- 拖拽到此处即并排显示；仅在可并排时于拖拽过程中浮现 -->
          <div class="dropzone dropzone--right" data-dropzone aria-hidden="true">
            <span class="dropzone__icon" data-dropzone-icon aria-hidden="true"></span>
            <span class="dropzone__text">拖到此处<br />并排显示</span>
          </div>
        </div>

        <p class="tabs-toast" data-tabs-toast role="status" aria-live="polite" hidden></p>
      </div>
    </main>

    <script type="module" src="./assets/js/shell.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>本地工具箱 · 纯客户端计算工具集</title>
    <meta
      name="description"
      content="一个完全在浏览器本地运行的工具集合，所有计算均在本机完成，不上传数据，不请求第三方资源。"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)" />

    <!-- 首屏主题引导：必须在样式表之前同步执行，避免明暗切换闪烁 -->
    <script src="./assets/js/theme-boot.js"></script>

    <link rel="stylesheet" href="./assets/css/tokens.css" />
    <link rel="stylesheet" href="./assets/css/base.css" />
    <link rel="stylesheet" href="./assets/css/shell.css" />
    <link rel="stylesheet" href="./assets/css/tool.css" />
  </head>

  <body>
    <noscript>
      <p class="no-script">
        本站需要启用 JavaScript 才能运行。所有计算都在你的浏览器本地完成，不会上传任何数据。
        <a href="./assets/noscript.html">查看说明</a>
      </p>
    </noscript>

    <!-- 应用外壳（左侧工具列表 + 顶部栏）由此节点注入 -->
    <div id="shell-root"></div>

    <main class="workspace" id="workspace">
      <section class="hero rise" style="--d: 0ms">
        <div>
          <p class="meta-label">本地工具集 · 零后端</p>
          <h1 class="hero__title">全部在<em>本机</em>完成的工具集</h1>
          <p class="hero__lead">
            一个可长期扩展的工具集合：每个工具独立成页、互不干扰，参数可保存为预设以便复用。
          </p>
        </div>
      </section>

      <div class="section-head rise" style="--d: 60ms">
        <div>
          <p class="meta-label">Tools</p>
          <h2>工具总览</h2>
        </div>
        <p class="panel__hint">
          已注册 <span data-tool-count class="mono">0</span> 个工具
        </p>
      </div>

      <ul class="tool-grid rise" style="--d: 120ms" data-tool-grid></ul>

      <footer class="site-foot rise" style="--d: 180ms" data-site-footer></footer>
    </main>

    <script type="module" src="./assets/js/shell.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>需要启用 JavaScript · 本地工具箱</title>
    <meta name="color-scheme" content="light dark" />
    <!-- 站点图标：内联 SVG（与左侧栏品牌标记同源），不新增文件、不产生额外请求，见 docs/DESIGN.md §3.6 -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%23c2410c'/%3E%3Cg%20transform='translate(6%206)%20scale(.8333)'%20fill='none'%20stroke='%23fff'%20stroke-width='2'%20stroke-linecap='round'%20stroke-linejoin='round'%3E%3Cpath%20d='M3%206h6'/%3E%3Cpath%20d='M3%2012h6'/%3E%3Cpath%20d='M3%2018h6'/%3E%3Cpath%20d='M10%206c3.5%200%203.5%206%207%206'/%3E%3Cpath%20d='M10%2018c3.5%200%203.5-6%207-6'/%3E%3Cpath%20d='M17%2012h4'/%3E%3Cpath%20d='M18.5%209.5%2021%2012l-2.5%202.5'/%3E%3C/g%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./css/tokens.css" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/tool.css" />
  </head>

  <body>
    <main class="workspace" id="workspace" style="max-width: 720px">
      <header class="tool-head">
        <div class="tool-head__main">
          <p class="meta-label">提示</p>
          <h1 class="tool-head__title">需要启用 JavaScript</h1>
          <p class="tool-head__desc">
            本工具集的所有计算都在你的浏览器本地完成，因此必须启用 JavaScript 才能使用。
            服务端不参与任何计算，也没有任何备用接口。
          </p>
        </div>
      </header>

      <div class="notice notice--warn" role="status">
        <span class="notice__icon" aria-hidden="true">!</span>
        <div class="notice__body">
          <p class="notice__title">如何启用</p>
          <p class="notice__text">
            请在浏览器设置中允许本站运行 JavaScript，然后刷新页面。
          </p>
        </div>
      </div>

      <div class="notice">
        <div class="notice__body">
          <p class="notice__title">隐私说明</p>
          <p class="notice__text">
            本站不发送任何网络请求、不加载第三方资源，也不接收或存储你的任何数据。
          </p>
        </div>
      </div>

      <footer class="site-foot">
        <span class="foot__privacy">数据不出设备 · 零第三方请求</span>
        <span class="foot__meta mono">本地工具箱 v0.1.0</span>
      </footer>
    </main>
  </body>
</html>
